{{ define "main" }}
<article class="markdown book-article">
  <h1>Tag: {{ .Title }}</h1>
  <ul class="tag-list" style="list-style: none; padding-left: 0;">
    {{ range .Pages }}
    <li style="margin-bottom: 1.5rem; border-bottom: 1px solid var(--gray-200); padding-bottom: 1rem;">
      <a href="{{ .Permalink }}" style="font-size: 1.25rem; font-weight: bold; text-decoration: none;">
        {{ .Title}}
      </a>
    </li>
    {{ end }}
  </ul>
</article>
{{ end }}
