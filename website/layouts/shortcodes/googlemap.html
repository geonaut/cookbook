{{ $id := .Get "id" }}
<div class="map-container" style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; margin: 1.5rem 0;">
  <iframe 
    src="https://www.google.com/maps/d/embed?mid={{ $id }}" 
    style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;" 
    allowfullscreen="" 
    loading="lazy">
  </iframe>
</div>
