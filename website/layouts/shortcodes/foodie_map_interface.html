{{ $map_id := .Page.Params.map_id }} 
{{ $categories := .Page.Params.map_categories }}

<div class="foodie-container">
  <aside class="map-sidebar">
    <div class="category-tabs">
      {{ range $categories }}
      <button class="tab-btn" onclick="openCategory(event, '{{ .id }}')">
        <span>{{ .name }}</span>
      </button>
      {{ end }}
    </div>

    <div class="locations-list">
      {{ range $categories }}
      <div id="{{ .id }}" class="tab-content">
        {{ range .locations }}
        <div class="location-card" onclick="zoomTo('{{ .lat }}', '{{ .lon }}')">
          <div class="loc-info">
            <div class="loc-name-row">
              <strong>{{ .name }}</strong>
             <small><a href="https://www.google.com/search?q={{ .name | urlquery }}+London" target="_blank">🔍</a></small>
            </div>
            {{ if .comment }}<small>{{ .comment }}</small>{{ end }}
          </div>
          <span class="zoom-icon">⌖</span>
        </div>
        {{ end }}
      </div>
      {{ end }}
    </div>
  </aside>

  <main class="map-main">
    <iframe id="main-foodie-map" src="https://www.google.com/maps/d/embed?mid={{ $map_id }}&ehbc=2E312F"></iframe>
  </main>
</div>

<script>
  function openCategory(evt, catId) {
    document.querySelectorAll(".tab-content").forEach((x) => (x.style.display = "none"));
    document.querySelectorAll(".tab-btn").forEach((x) => x.classList.remove("active"));
    document.getElementById(catId).style.display = "block";
    evt.currentTarget.classList.add("active");
  }

  function zoomTo(lat, lon) {
    if (!lat || lat === "0") return;
    const map = document.getElementById("main-foodie-map");
    map.src = `https://www.google.com/maps/d/embed?mid={{ $map_id }}&ll=${lat}%2C${lon}&z=18`;
  }

  document.addEventListener("DOMContentLoaded", () => {
    const firstTab = document.querySelector(".tab-btn");
    if (firstTab) firstTab.click();
  });
</script>
