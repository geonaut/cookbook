baseURL = "https://geonauts-cookbook.uk/"
title = "Geonaut's Cookbook"

[outputFormats.print]
  name = "print"
  baseName = "index"
  isHTML = true
  mediaType = "text/html"
  path = "print"

[languages]
  [languages.en]
    languageCode = "en-US"
    contentDir = "content.en"
    weight = 1

[params]
  homeEyebrow = "Welcome to"
  description = "A collection of recipes for delicious cooking."

  instagram    = "https://www.instagram.com/placeholder"
  githubRepo   = "https://github.com/geonaut/cookbook"
  buildCommit  = ""  # set via HUGO_PARAMS_BUILDCOMMIT at deploy time

  [params.colors]
    primary = "#1b4332"
    tertiary = "#9d0208"

  [[params.utilityCards]]
    title = "PDF Cookbook"
    description = "Download the entire collection as a printable, bookmarked PDF."
    url = "/pdf-cookbook"
    icon = "picture_as_pdf"
    color = "primary"

  [[params.utilityCards]]
    title = "Foodie Map"
    description = "An interactive map of my favourite local markets and hidden gems."
    url = "/foodie-map"
    icon = "location_on"
    color = "tertiary"

[menus]
  [[menus.main]]
    name = "Recipes"
    pageRef = "/recipes"
    weight = 10
    [menus.main.params]
      icon = "menu_book"

  [[menus.main]]
    name = "Tags"
    pageRef = "/tags"
    weight = 20
    [menus.main.params]
      icon = "label"

  [[menus.main]]
    name = "Writing"
    pageRef = "/writing"
    weight = 30
    [menus.main.params]
      icon = "edit_note"

  [[menus.main]]
    name = "PDF"
    pageRef = "/pdf-cookbook"
    weight = 35
    [menus.main.params]
      icon = "picture_as_pdf"

  [[menus.main]]
    name = "Map"
    pageRef = "/foodie-map"
    weight = 40
    [menus.main.params]
      icon = "map"

  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 50
    [menus.main.params]
      icon = "person"

  [[menus.main]]
    name = "Contact"
    pageRef = "/contact"
    weight = 60
    [menus.main.params]
      icon = "mail"

[[cascade]]
  layout = "fullwidth"
  [cascade._target]
    path = "/foodie-map"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[module]
  [[module.imports]]
    path = "github.com/geonaut/hugo-cookbook-theme"
