title = "Baked Gammon with Pineapple Glaze"
category = "Special Occaisions"
ingredients = [
    "Gammon",
    "Fresh pineapple - fibrous core removed",
    "Spices - cloves, cinnamon, nutmeg, or mixed spice",
    "Ginger - fresh and/or ground",
    "Honey",
    "Vinegar (mild)",
    "Marmelade",
]
instructions = [
    "Pressure cook the gammon for 20 minutes per 500g plus 20 minutes.",
    "Blend the other ingredients to make a glaze.",
]

# Optional: hints and tips for the recipe
hints = [
    "Buy the pineapple in advance, to make sure it's ripe.",
]

